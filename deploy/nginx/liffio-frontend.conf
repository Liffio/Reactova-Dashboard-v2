# app.liffio.com (React dashboard)
# TLS at Nginx; static app served by Node `serve` on 127.0.0.1:3000 (PM2).
server {
    listen 80;
    server_name app.liffio.com;
    return 301 https://app.liffio.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name app.liffio.com;

    ssl_certificate     /etc/ssl/cloudflare/liffio.pem;
    ssl_certificate_key /etc/ssl/cloudflare/liffio.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    include /etc/nginx/cloudflare-ips.conf;
    deny all;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Same-origin /api/* (e.g. opening app.liffio.com/api/... in the browser) proxies to the API host so paths are not swallowed by the SPA.
    location /api/ {
        proxy_pass https://api.liffio.com/api/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host api.liffio.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
