name: Deploy Frontend

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: false   # never cancel a running deploy mid-flight

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Write the .env file to /tmp on the server before the deploy script runs.
      # The deploy script picks it up from /tmp/.env.deploy.
      - name: Write .env to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cat > /tmp/.env.deploy << 'ENVEOF'
            ${{ secrets.APP_ENV }}
            ENVEOF

      - name: Run deploy script
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: bash /var/www/reactova-dashboard/deploy/deploy.sh

      - name: Health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            sleep 3
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000)
            if [ "$STATUS" != "200" ]; then
              echo "Health check failed — HTTP $STATUS"
              pm2 logs liffio-dashboard --lines 30 --nostream
              exit 1
            fi
            echo "Health check passed — HTTP $STATUS"
