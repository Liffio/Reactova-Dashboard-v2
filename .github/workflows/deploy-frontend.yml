name: Deploy Frontend

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: deploy-frontend-production
  cancel-in-progress: false

jobs:
  notify-start:
    name: Notify Discord — started
    runs-on: ubuntu-latest
    steps:
      - name: Post to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "${DISCORD_WEBHOOK}" ]; then
            echo "DISCORD_WEBHOOK_URL not set — skipping"
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sf -H "Content-Type: application/json" -d "$(jq -n \
            --arg title "🚀 Frontend deploy started" \
            --arg repo "${{ github.repository }}" \
            --arg branch "${{ github.ref_name }}" \
            --arg actor "${{ github.actor }}" \
            --arg sha "${{ github.sha }}" \
            --arg run "$RUN_URL" \
            '{
              embeds: [{
                title: $title,
                color: 3447003,
                fields: [
                  { name: "Repo", value: $repo, inline: true },
                  { name: "Branch", value: $branch, inline: true },
                  { name: "Triggered by", value: $actor, inline: true },
                  { name: "Commit", value: ($sha | .[0:7]), inline: true },
                  { name: "Run", value: $run }
                ],
                timestamp: (now | strftime("%Y-%m-%dT%H:%M:%SZ"))
              }]
            }')" \
            "$DISCORD_WEBHOOK"

  validate:
    name: Validate React Dashboard
    runs-on: ubuntu-latest
    needs: notify-start
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://api.liffio.com

  deploy:
    name: Deploy to Frontend Droplet
    runs-on: ubuntu-latest
    needs: validate
    environment: production
    steps:
      - name: Deploy React dashboard
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.FRONTEND_DROPLET_IP }}
          username: root
          password: ${{ secrets.FRONTEND_DROPLET_PASSWORD }}
          port: ${{ secrets.FRONTEND_DROPLET_PORT || '22' }}
          timeout: 3m
          command_timeout: 15m
          debug: true
          script: |
            set -euxo pipefail

            export NVM_DIR="${NVM_DIR:-/root/.nvm}"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
              nvm use 20 >/dev/null 2>&1 || nvm use --lts >/dev/null 2>&1 || true
            fi

            NODE_MAJOR="$(node -p "process.versions.node.split('.')[0]" 2>/dev/null || echo 0)"
            if [ "$NODE_MAJOR" != "20" ]; then
              echo "Installing Node.js 20 and npm."
              curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
              apt-get install -y nodejs
            fi

            node --version
            npm --version

            if ! command -v pm2 >/dev/null 2>&1; then
              npm install --global pm2
            fi
            pm2 --version

            DEPLOY_PATH="${{ secrets.FRONTEND_DEPLOY_PATH }}"
            DEPLOY_PATH="${DEPLOY_PATH#"${DEPLOY_PATH%%[![:space:]]*}"}"
            DEPLOY_PATH="${DEPLOY_PATH%"${DEPLOY_PATH##*[![:space:]]}"}"
            if [ -z "${DEPLOY_PATH}" ]; then
              DEPLOY_PATH="/var/www/liffio-dashboard"
            fi

            echo "Deploying app.liffio.com React dashboard to ${DEPLOY_PATH}"
            if [ ! -d "${DEPLOY_PATH}" ]; then
              echo "Deploy path is not a directory: ${DEPLOY_PATH}. Create it and clone this repo, or set FRONTEND_DEPLOY_PATH (no trailing newline)."
              exit 1
            fi
            cd "${DEPLOY_PATH}"

            if [ ! -d .git ]; then
              echo "${DEPLOY_PATH} is not a git repository. Clone the frontend repo there before deploying."
              exit 128
            fi

            BRANCH="${{ github.ref_name }}"
            git fetch --prune origin "${BRANCH}"
            if ! git rev-parse --verify "origin/${BRANCH}" >/dev/null 2>&1; then
              echo "origin/${BRANCH} not found after fetch."
              git remote -v
              git branch -r || true
              exit 1
            fi
            git reset --hard "origin/${BRANCH}"
            git clean -fd

            npm ci
            # Must match API CORS allowlist (see server APP_PUBLIC_URL / CORS_ORIGINS). Rebuild if API host changes.
            VITE_API_URL=https://api.liffio.com npm run build

            pm2 startOrReload ecosystem.config.cjs --env production --update-env
            pm2 save
            pm2 status

            if command -v nginx >/dev/null 2>&1; then
              nginx -t && systemctl reload nginx || true
            fi
            systemctl is-active nginx || true

      - name: Purge Cloudflare Cache
        if: success()
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          RESPONSE=$(curl -s -X POST \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"purge_everything":true}')
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"success":true' || (echo "Cache purge failed" && exit 1)

  notify-finish:
    name: Notify Discord — success or failure
    runs-on: ubuntu-latest
    needs: [validate, deploy]
    if: ${{ always() }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Post result to Discord
        uses: ./.github/actions/discord-notify
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          alert_role_id: ${{ secrets.DISCORD_ALERT_ROLE_ID }}
          app_label: Frontend
          validate_result: ${{ needs.validate.result }}
          deploy_result: ${{ needs.deploy.result }}
          branch: ${{ github.ref_name }}
          actor: ${{ github.actor }}
          run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
