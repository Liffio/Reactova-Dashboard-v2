# reactova.com (Next.js marketing)
server {
    listen 80;
    server_name reactova.com www.reactova.com;
    return 301 https://reactova.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name reactova.com www.reactova.com;

    ssl_certificate     /etc/ssl/cloudflare/reactova.pem;
    ssl_certificate_key /etc/ssl/cloudflare/reactova.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    include /etc/nginx/cloudflare-ips.conf;
    deny all;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /_next/static/ {
        proxy_pass http://localhost:3002;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://localhost:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}

# app.reactova.com (React dashboard)
server {
    listen 80;
    server_name app.reactova.com;
    return 301 https://app.reactova.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name app.reactova.com;

    ssl_certificate     /etc/ssl/cloudflare/reactova.pem;
    ssl_certificate_key /etc/ssl/cloudflare/reactova.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    include /etc/nginx/cloudflare-ips.conf;
    deny all;

    root /var/www/reactova-dashboard/dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
