name: Deploy Frontend

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: deploy-frontend-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate React Dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://api.reactova.com

  deploy:
    name: Deploy to Frontend Droplet
    runs-on: ubuntu-latest
    needs: validate
    environment: production
    steps:
      - name: Deploy React dashboard
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.FRONTEND_DROPLET_IP }}
          username: root
          password: ${{ secrets.FRONTEND_DROPLET_PASSWORD }}
          port: ${{ secrets.FRONTEND_DROPLET_PORT || '22' }}
          timeout: 3m
          command_timeout: 15m
          debug: true
          script: |
            set -euxo pipefail

            export NVM_DIR="${NVM_DIR:-/root/.nvm}"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
              nvm use 20 >/dev/null 2>&1 || nvm use --lts >/dev/null 2>&1 || true
            fi

            NODE_MAJOR="$(node -p "process.versions.node.split('.')[0]" 2>/dev/null || echo 0)"
            if [ "$NODE_MAJOR" != "20" ]; then
              echo "Installing Node.js 20 and npm."
              curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
              apt-get install -y nodejs
            fi

            node --version
            npm --version

            if ! command -v pm2 >/dev/null 2>&1; then
              npm install --global pm2
            fi
            pm2 --version

            DEPLOY_PATH="${{ secrets.FRONTEND_DEPLOY_PATH }}"
            if [ -z "${DEPLOY_PATH}" ]; then
              DEPLOY_PATH="/var/www/reactova-dashboard"
            fi

            echo "Deploying app.reactova.com React dashboard to ${DEPLOY_PATH}"
            if [ ! -d "${DEPLOY_PATH}" ]; then
              echo "Deploy path is not a directory: ${DEPLOY_PATH}. Create it and clone this repo, or set FRONTEND_DEPLOY_PATH."
              exit 1
            fi
            cd "${DEPLOY_PATH}"

            if [ ! -d .git ]; then
              echo "${DEPLOY_PATH} is not a git repository. Clone the frontend repo there before deploying."
              exit 128
            fi

            BRANCH="${{ github.ref_name }}"
            git fetch --prune origin "${BRANCH}"
            if ! git rev-parse --verify "origin/${BRANCH}" >/dev/null 2>&1; then
              echo "origin/${BRANCH} not found after fetch."
              git remote -v
              git branch -r || true
              exit 1
            fi
            git reset --hard "origin/${BRANCH}"
            git clean -fd

            npm ci
            VITE_API_URL=https://api.reactova.com npm run build

            pm2 startOrReload ecosystem.config.cjs --env production --update-env
            pm2 save
            pm2 status

            if command -v nginx >/dev/null 2>&1; then
              nginx -t && systemctl reload nginx || true
            fi
            systemctl is-active nginx || true

      - name: Notify success
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -s -X POST "$SLACK_WEBHOOK_URL" \
              -H 'Content-type: application/json' \
              -d '{"text":"Frontend deployed successfully to production"}'
          fi

      - name: Notify failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -s -X POST "$SLACK_WEBHOOK_URL" \
              -H 'Content-type: application/json' \
              -d '{"text":"Frontend deployment failed. Check GitHub Actions."}'
          fi
