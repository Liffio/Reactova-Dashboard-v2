name: Deploy Frontend

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: deploy-frontend-production
  cancel-in-progress: true

jobs:
  notify-start:
    name: Notify Discord — started
    runs-on: ubuntu-latest
    steps:
      - name: Post to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "${DISCORD_WEBHOOK}" ]; then
            echo "DISCORD_WEBHOOK_URL not set — skipping"
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sf -H "Content-Type: application/json" -d "$(jq -n \
            --arg title "🚀 Frontend deploy started" \
            --arg repo "${{ github.repository }}" \
            --arg branch "${{ github.ref_name }}" \
            --arg actor "${{ github.actor }}" \
            --arg sha "${{ github.sha }}" \
            --arg run "$RUN_URL" \
            '{
              embeds: [{
                title: $title,
                color: 3447003,
                fields: [
                  { name: "Repo", value: $repo, inline: true },
                  { name: "Branch", value: $branch, inline: true },
                  { name: "Triggered by", value: $actor, inline: true },
                  { name: "Commit", value: ($sha | .[0:7]), inline: true },
                  { name: "Run", value: $run }
                ],
                timestamp: (now | strftime("%Y-%m-%dT%H:%M:%SZ"))
              }]
            }')" \
            "$DISCORD_WEBHOOK"

  validate:
    name: Validate Frontend
    runs-on: ubuntu-latest
    needs: notify-start

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  deploy:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: validate
    environment: production

    permissions:
      contents: read
      packages: write   # allows GITHUB_TOKEN to push to ghcr.io

    env:
      # Force Docker actions (login, buildx, build-push) to use Node 24 instead of the
      # deprecated Node 20 runtime. Remove once upstream actions ship Node 24 builds natively.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive lowercase image name
        # GHCR requires all-lowercase repository paths. github.repository_owner
        # preserves the original casing (e.g. "Reactova"), which fails the push.
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "LIFFIO_IMAGE=ghcr.io/${OWNER}/liffio-frontend" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.LIFFIO_IMAGE }}:${{ github.sha }}
            ${{ env.LIFFIO_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Copy docker-compose.yml to droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          source: docker-compose.yml
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          # LIFFIO_IMAGE + IMAGE_TAG are computed values (not secrets) injected via envs: below.
          LIFFIO_IMAGE: ${{ env.LIFFIO_IMAGE }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          envs: LIFFIO_IMAGE,IMAGE_TAG
          timeout: 5m
          command_timeout: 20m
          script: |
            set -euo pipefail

            cd "${{ secrets.DEPLOY_PATH }}"

            # LIFFIO_IMAGE and IMAGE_TAG are injected by the runner via envs:.
            # Rollback: SSH in, set LIFFIO_IMAGE + IMAGE_TAG to a previous SHA, run docker compose up -d.

            # ── 0. Ensure Docker is present (first deploy on this droplet installs it) ─
            if ! command -v docker >/dev/null 2>&1; then
              echo "Docker not found — installing via get.docker.com..."
              curl -fsSL https://get.docker.com | sh
              systemctl enable --now docker
            fi

            # ── 1. Registry auth ─────────────────────────────────────────────────────
            # GHCR_PAT: GitHub CLASSIC PAT with read:packages scope, stored as repo secret.
            # Fine-grained PATs do NOT work with GHCR — login succeeds but every pull 403s.
            # GITHUB_TOKEN cannot be used here — it only authenticates inside Actions runners.
            # Username must be the PAT owner's login — github.actor breaks when someone
            # else pushes; set GHCR_USERNAME to the PAT creator's username to pin it.
            if [ -z "${{ secrets.GHCR_PAT }}" ]; then
              echo "ERROR: GHCR_PAT repo secret is not set — the droplet cannot pull from ghcr.io without it."
              exit 1
            fi
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME || github.actor }}" --password-stdin
            echo "Logged in to ghcr.io"

            # ── 2. Pull new image ────────────────────────────────────────────────────
            echo "Pulling ${LIFFIO_IMAGE}:${IMAGE_TAG}..."
            docker compose pull
            echo "Pull complete."

            # ── 3. One-time takeover from the legacy PM2 deploy ──────────────────────
            # The old pipeline ran server-start.mjs under PM2 on the same port (3000).
            # Remove it so the container can bind — a no-op on every later deploy.
            if command -v pm2 >/dev/null 2>&1 && pm2 jlist | grep -q '"name":"liffio-dashboard"'; then
              echo "Stopping legacy PM2 process liffio-dashboard..."
              pm2 delete liffio-dashboard || true
              pm2 save || true
            fi

            # ── 4. Swap containers ───────────────────────────────────────────────────
            echo "Starting updated container..."
            docker compose up -d --force-recreate --remove-orphans

            # ── 5. Wait for the web container to be healthy ──────────────────────────
            echo "Waiting for web container to be healthy (up to 120s)..."
            DEADLINE=$(($(date +%s) + 120))
            while [ "$(date +%s)" -lt "$DEADLINE" ]; do
              CONTAINER_ID=$(docker compose ps -q web 2>/dev/null | head -1)
              if [ -n "$CONTAINER_ID" ]; then
                STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$CONTAINER_ID" 2>/dev/null || echo "unknown")
                echo "  $(date +%H:%M:%S)  web health: $STATUS"
                if [ "$STATUS" = "healthy" ]; then
                  echo "Web container is healthy."
                  break
                fi
                if [ "$STATUS" = "unhealthy" ]; then
                  echo "ERROR: web container is unhealthy. Recent logs:"
                  docker compose logs web --tail=100 --no-log-prefix
                  exit 1
                fi
              else
                echo "  $(date +%H:%M:%S)  web container not running yet..."
              fi
              sleep 5
            done

            CONTAINER_ID=$(docker compose ps -q web 2>/dev/null | head -1)
            FINAL_STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$CONTAINER_ID" 2>/dev/null || echo "unknown")
            if [ "$FINAL_STATUS" != "healthy" ]; then
              echo "ERROR: web container did not become healthy within 120s (last status: $FINAL_STATUS)"
              docker compose logs web --tail=100 --no-log-prefix
              exit 1
            fi

            # ── 6. Stale-build check ─────────────────────────────────────────────────
            # The root page returning 200 isn't enough: a stale SSR bundle can reference
            # asset hashes a fresh build just replaced. Verify at least one referenced
            # asset actually resolves from the NEW container.
            # --compressed + grep -a: the SSR response can arrive gzipped, which makes
            # plain grep classify the body as binary and silently match nothing.
            HTML=$(curl -s --compressed -w '\n%{http_code}' http://127.0.0.1:3000/)
            HTTP_STATUS=$(echo "$HTML" | tail -1)
            BODY=$(echo "$HTML" | sed '$d')
            if [ "$HTTP_STATUS" != "200" ]; then
              echo "Stale-build check failed — HTTP $HTTP_STATUS on /"
              docker compose logs web --tail=50 --no-log-prefix
              exit 1
            fi
            ASSET=$(echo "$BODY" | grep -aoE '/assets/[A-Za-z0-9_.-]+\.(js|css)' | head -1)
            if [ -z "$ASSET" ]; then
              echo "Stale-build check failed — no asset reference found in / response"
              exit 1
            fi
            ASSET_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:3000$ASSET")
            if [ "$ASSET_STATUS" != "200" ]; then
              echo "Stale-build check failed — HTTP $ASSET_STATUS on $ASSET"
              docker compose logs web --tail=50 --no-log-prefix
              exit 1
            fi
            echo "Asset check passed — $ASSET returned $ASSET_STATUS"

            # ── 7. Prune old dangling images ─────────────────────────────────────────
            docker image prune -f
            echo ""
            echo "Deployment complete: ${LIFFIO_IMAGE}:${IMAGE_TAG}"
            docker compose ps

      - name: Purge Cloudflare cache
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ZONE_ID" ]; then
            echo "Cloudflare secrets not set — skipping cache purge"
            exit 0
          fi
          HTTP_CODE=$(curl -s -o /tmp/cf-purge-response.txt -w "%{http_code}" \
            -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          cat /tmp/cf-purge-response.txt
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Cloudflare purge failed — HTTP $HTTP_CODE"
            exit 1
          fi
          echo "Cloudflare cache purged (HTTP $HTTP_CODE)"

  notify-finish:
    name: Notify Discord — success or failure
    runs-on: ubuntu-latest
    needs: [validate, deploy]
    if: ${{ always() }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Post result to Discord
        uses: ./.github/actions/discord-notify
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          alert_role_id: ${{ secrets.DISCORD_ALERT_ROLE_ID }}
          app_label: Frontend
          validate_result: ${{ needs.validate.result }}
          deploy_result: ${{ needs.deploy.result }}
          branch: ${{ github.ref_name }}
          actor: ${{ github.actor }}
          run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
