name: Deploy Frontend

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: deploy-frontend-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate React Dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://api.reactova.com

  deploy:
    name: Deploy to Frontend Droplet
    runs-on: ubuntu-latest
    needs: validate
    environment: production
    steps:
      - name: Deploy React dashboard
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.FRONTEND_DROPLET_IP }}
          username: root
          password: ${{ secrets.FRONTEND_DROPLET_PASSWORD }}
          port: ${{ secrets.FRONTEND_DROPLET_PORT || 22 }}
          command_timeout: 10m
          script_stop: false
          debug: true
          script: |
            set -euxo pipefail

            export NVM_DIR="${NVM_DIR:-/root/.nvm}"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
              nvm use 20 >/dev/null 2>&1 || nvm use --lts >/dev/null 2>&1 || true
            fi

            NODE_MAJOR="$(node -p "process.versions.node.split('.')[0]" 2>/dev/null || echo 0)"
            if [ "$NODE_MAJOR" != "20" ]; then
              echo "Installing Node.js 20 and npm."
              curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
              apt-get install -y nodejs
            fi

            node --version
            npm --version

            echo "Deploying app.reactova.com React dashboard"
            cd /var/www/reactova-dashboard
            git fetch origin "${{ github.ref_name }}"
            git checkout "${{ github.ref_name }}"
            git pull --ff-only origin "${{ github.ref_name }}"
            npm ci
            VITE_API_URL=https://api.reactova.com npm run build

            echo "Dashboard is static; Nginx serves dist/ directly"
            systemctl is-active nginx

      - name: Notify success
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -s -X POST "$SLACK_WEBHOOK_URL" \
              -H 'Content-type: application/json' \
              -d '{"text":"Frontend deployed successfully to production"}'
          fi

      - name: Notify failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -s -X POST "$SLACK_WEBHOOK_URL" \
              -H 'Content-type: application/json' \
              -d '{"text":"Frontend deployment failed. Check GitHub Actions."}'
          fi
