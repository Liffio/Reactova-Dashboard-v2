name: Deploy Frontend

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: false   # never cancel a running deploy mid-flight

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Write the .env file to /tmp on the server before the deploy script runs.
      # The deploy script picks it up from /tmp/.env.deploy.
      - name: Write .env to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cat > /tmp/.env.deploy << 'ENVEOF'
            ${{ secrets.APP_ENV }}
            ENVEOF

      - name: Run deploy script
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: bash /var/www/reactova-dashboard/deploy/deploy.sh

      - name: Health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            sleep 3
            HTML=$(curl -s -w '\n%{http_code}' http://127.0.0.1:3000/)
            STATUS=$(echo "$HTML" | tail -1)
            BODY=$(echo "$HTML" | sed '$d')
            if [ "$STATUS" != "200" ]; then
              echo "Health check failed — HTTP $STATUS on /"
              pm2 logs liffio-dashboard --lines 30 --nostream
              exit 1
            fi
            echo "Root check passed — HTTP $STATUS"

            # The root page returning 200 isn't enough: a stale in-memory SSR
            # bundle can still reference asset hashes a fresh build just deleted
            # from disk. Verify at least one referenced asset actually resolves.
            ASSET=$(echo "$BODY" | grep -oE '/assets/[A-Za-z0-9_.-]+\.(js|css)' | head -1)
            if [ -z "$ASSET" ]; then
              echo "Health check failed — no asset reference found in / response"
              exit 1
            fi
            ASSET_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:3000$ASSET")
            if [ "$ASSET_STATUS" != "200" ]; then
              echo "Health check failed — HTTP $ASSET_STATUS on $ASSET (stale build reference?)"
              pm2 logs liffio-dashboard --lines 30 --nostream
              exit 1
            fi
            echo "Asset check passed — $ASSET returned $ASSET_STATUS"
