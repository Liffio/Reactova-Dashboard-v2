name: Deploy Frontend

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: deploy-frontend-production
  cancel-in-progress: true

jobs:
  notify-start:
    name: Notify Discord — started
    runs-on: ubuntu-latest
    steps:
      - name: Post to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "${DISCORD_WEBHOOK}" ]; then
            echo "DISCORD_WEBHOOK_URL not set — skipping"
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sf -H "Content-Type: application/json" -d "$(jq -n \
            --arg title "🚀 Frontend deploy started" \
            --arg repo "${{ github.repository }}" \
            --arg branch "${{ github.ref_name }}" \
            --arg actor "${{ github.actor }}" \
            --arg sha "${{ github.sha }}" \
            --arg run "$RUN_URL" \
            '{
              embeds: [{
                title: $title,
                color: 3447003,
                fields: [
                  { name: "Repo", value: $repo, inline: true },
                  { name: "Branch", value: $branch, inline: true },
                  { name: "Triggered by", value: $actor, inline: true },
                  { name: "Commit", value: ($sha | .[0:7]), inline: true },
                  { name: "Run", value: $run }
                ],
                timestamp: (now | strftime("%Y-%m-%dT%H:%M:%SZ"))
              }]
            }')" \
            "$DISCORD_WEBHOOK"

  validate:
    name: Validate Frontend
    runs-on: ubuntu-latest
    needs: notify-start

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: validate
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run deploy script
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          timeout: 5m
          command_timeout: 15m
          script: bash "${{ secrets.DEPLOY_PATH }}/deploy/deploy.sh"

      - name: Health check
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          script: |
            sleep 3
            HTML=$(curl -s -w '\n%{http_code}' http://127.0.0.1:3000/)
            STATUS=$(echo "$HTML" | tail -1)
            BODY=$(echo "$HTML" | sed '$d')
            if [ "$STATUS" != "200" ]; then
              echo "Health check failed — HTTP $STATUS on /"
              pm2 logs liffio-dashboard --lines 30 --nostream
              exit 1
            fi
            echo "Root check passed — HTTP $STATUS"

            # The root page returning 200 isn't enough: a stale in-memory SSR
            # bundle can still reference asset hashes a fresh build just deleted
            # from disk. Verify at least one referenced asset actually resolves.
            ASSET=$(echo "$BODY" | grep -oE '/assets/[A-Za-z0-9_.-]+\.(js|css)' | head -1)
            if [ -z "$ASSET" ]; then
              echo "Health check failed — no asset reference found in / response"
              exit 1
            fi
            ASSET_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:3000$ASSET")
            if [ "$ASSET_STATUS" != "200" ]; then
              echo "Health check failed — HTTP $ASSET_STATUS on $ASSET (stale build reference?)"
              pm2 logs liffio-dashboard --lines 30 --nostream
              exit 1
            fi
            echo "Asset check passed — $ASSET returned $ASSET_STATUS"

      - name: Purge Cloudflare cache
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ZONE_ID" ]; then
            echo "Cloudflare secrets not set — skipping cache purge"
            exit 0
          fi
          HTTP_CODE=$(curl -s -o /tmp/cf-purge-response.txt -w "%{http_code}" \
            -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          cat /tmp/cf-purge-response.txt
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Cloudflare purge failed — HTTP $HTTP_CODE"
            exit 1
          fi
          echo "Cloudflare cache purged (HTTP $HTTP_CODE)"

  notify-finish:
    name: Notify Discord — success or failure
    runs-on: ubuntu-latest
    needs: [validate, deploy]
    if: ${{ always() }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Post result to Discord
        uses: ./.github/actions/discord-notify
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          alert_role_id: ${{ secrets.DISCORD_ALERT_ROLE_ID }}
          app_label: Frontend
          validate_result: ${{ needs.validate.result }}
          deploy_result: ${{ needs.deploy.result }}
          branch: ${{ github.ref_name }}
          actor: ${{ github.actor }}
          run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
